  <!-- Name -->
  <text x="120" y="270" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">Rani Rakesh</text>
  <text x="120" y="350" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">Gangurde</text>
