  <text x="120" y="400" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Software Developer · Shopify · Full Stack · AI/ML</text>
  <!-- Divider -->
  <rect x="120" y="430" width="200" height="2" fill="url(#accent)" rx="1"/>
  <!-- Footer line -->
  <text x="120" y="520" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#64748b">github.com/Raani14 · linkedin.com/in/rani-gangurde-85044b33b</text>
